
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Jump</title>
    <link rel="stylesheet" href="css/mario.css">
</head>

<body>

    <div id="game">

        <h1>AURA JUMP</h1>

        <div class="score">
            Pontuação: <span id="score">0</span>
        </div>

        <div id="player">
            <img id="player-image" src="images/67.gif" alt="Menino do 67">
        </div>

        <div id="ground"></div>

        <div id="game-over">
            <h2>FIM DE JOGO!</h2>
            <p>Sua pontuação: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Jogar novamente</button>
        </div>

    </div>

    <script src="js/aura.js"></script>

</body>
</html>
